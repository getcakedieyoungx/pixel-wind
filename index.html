<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Wind</title>
    <meta
      name="description"
      content="Turn any pixel-art sprite into a seamless wind sway loop. No shimmer, no new colours. Runs in your browser."
    />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <header>
      <h1>Pixel Wind</h1>
      <p class="tag">Any sprite → seamless wind loop. No shimmer, no new colours. Nothing leaves your browser.</p>
    </header>
    <main>
      <section id="drop" class="drop">
        <p>Drop a PNG sprite here or <label class="pick">choose a file<input id="file" type="file" accept="image/png" hidden /></label></p>
        <button id="demo" type="button">Try the demo sprite</button>
      </section>
      <p id="error" class="error" role="alert" hidden></p>
      <section id="work" hidden>
        <div class="stage">
          <figure id="cmpFig" hidden>
            <canvas id="cmp"></canvas>
            <figcaption>Typical rotation sway</figcaption>
          </figure>
          <figure>
            <canvas id="view"></canvas>
            <figcaption>Pixel Wind</figcaption>
          </figure>
        </div>
        <p class="hint">Drag on the sprite to move the pin line (red). Everything below it stays still.</p>
        <form id="controls">
          <label>Strength
            <select id="strength"><option value="1">1 px</option><option value="2" selected>2 px</option><option value="3">3 px</option></select>
          </label>
          <label>Frames
            <select id="frames"><option>6</option><option selected>8</option><option>12</option></select>
          </label>
          <label>FPS <input id="fps" type="number" min="1" max="24" value="6" /></label>
          <button id="shuffle" type="button">Shuffle wind</button>
          <label class="toggle"><input id="compare" type="checkbox" /> Compare</label>
        </form>
        <ul id="badges" class="badges"></ul>
        <div class="exports">
          <button id="dlGif" type="button">GIF</button>
          <button id="dlSheet" type="button">Sprite sheet + JSON</button>
          <button id="dlZip" type="button">ZIP (frames + sheet)</button>
          <span id="exportNote" class="note"></span>
        </div>
      </section>
    </main>
    <footer><a href="https://github.com/getcakedieyoungx/pixel-wind">Source on GitHub</a> · MIT</footer>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
